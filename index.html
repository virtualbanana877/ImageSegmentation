<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画像分割ツール(X用)</title>
<style>
:root{--bg:#fffbea;--sf:#fff;--tx:#2b2500;--mu:#7a6f3a;--ac:#f5c400;--act:#2b2500;--bd:#eadf9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1800;--sf:#2a2600;--tx:#fff6c2;--mu:#c9bc6a;--ac:#f5c400;--act:#1b1800;--bd:#4a4200}}
:root[data-theme="dark"]{--bg:#1b1800;--sf:#2a2600;--tx:#fff6c2;--mu:#c9bc6a;--ac:#f5c400;--act:#1b1800;--bd:#4a4200}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
p.s{color:var(--mu);font-size:.85rem;margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
#drop{display:block;text-align:center;padding:28px 12px;border:2px dashed var(--ac);border-radius:14px;cursor:pointer;font-weight:600}
#drop.on{background:var(--bd)}
#drop,.alt{position:relative;overflow:hidden}
.alt{display:block;text-align:center;padding:12px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;font-size:.85rem;color:var(--mu)}
input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label.f{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:3px;flex:1;min-width:90px}
input[type=number],select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--act);cursor:pointer}
button.sub{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:10px 6px;min-height:40px;width:100%;margin-top:4px;font-size:.8rem}
button:disabled{opacity:.5}
#stage{position:relative;line-height:0;border-radius:8px;overflow:hidden}
#stage img{width:100%;height:auto;display:block}
#grid{position:absolute;inset:0;pointer-events:none}
.scroll{overflow-x:auto;padding-bottom:6px}
#out{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.t{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px;text-align:center;font-size:.7rem;color:var(--mu)}
.t img{width:100%;height:auto;display:block;border-radius:4px;-webkit-touch-callout:default}
.msg{font-size:.85rem;color:var(--mu);margin:8px 0 0}
[hidden]{display:none!important}
button,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:480px){main{padding:12px}h1{font-size:1.1rem}#drop{padding:40px 12px}.row button{flex:1;min-height:46px}#out{grid-template-columns:repeat(4,1fr)}.t{font-size:.65rem}}
</style>
</head>
<body>
<main>
<h1>🍌 画像分割ツール</h1>
<p class="s">画像を横に分割して、Xに最大20枚まで添付できる形に変換します。処理はすべて端末内で完了します。</p>

<div id="drop">画像を選択 / ドロップ<input type="file" id="file" accept="image/*"></div>
<div class="alt">開かないときはこちら(ファイルから選ぶ)<input type="file" id="file2"></div>

<section id="work" hidden>
  <div class="card">
    <div class="row">
      <label class="f">横の分割数<input type="number" id="cols" value="20" min="1" max="20" inputmode="numeric"></label>
      <label class="f">縦の分割数<input type="number" id="rows" value="1" min="1" max="20" inputmode="numeric"></label>
      <label class="f">形式<select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option></select></label>
    </div>
    <div id="stage"><img id="orig" alt="元画像"><canvas id="grid"></canvas></div>
    <p class="msg" id="info"></p>
  </div>
  <div class="card">
    <div class="row">
      <button id="split">分割する</button>
      <button id="zip" disabled>ZIPで保存</button>
      <button id="share" hidden>写真に保存・共有</button>
    </div>
    <div class="scroll"><div id="out"></div></div>
    <p class="msg" id="hint"></p>
  </div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var img=null,pieces=[],dl=null,urls=[];
  var drop=$('drop'),file=$('file');

  claude_init();
  function claude_init(){
    try{
      if(window.claude&&claude.use){
        claude.use('downloads').then(function(d){dl=d;}).catch(function(){});
      }
    }catch(e){}
  }

  function num(el){var v=parseInt(el.value,10);if(!v||v<1)v=1;if(v>20)v=20;return v}
  function ext(){return $('fmt').value}

  function load(f){
    if(!f||!f.type.startsWith('image/'))return;
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      img=im;img.baseName=(f.name||'image').replace(/\.[^.]+$/,'');
      $('orig').src=u;$('work').hidden=false;
      clearOut();drawGrid();
    };
    im.src=u;
  }
  file.addEventListener('change',function(){load(file.files[0])});
  $('file2').addEventListener('change',function(){load($('file2').files[0])});
  ['dragover','dragenter'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('on')})});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('on')})});
  drop.addEventListener('drop',function(ev){load(ev.dataTransfer.files[0])});

  function drawGrid(){
    if(!img)return;
    var c=num($('cols')),r=num($('rows')),g=$('grid'),s=$('stage');
    var w=s.clientWidth||300,h=Math.round(w*img.naturalHeight/img.naturalWidth);
    g.width=w;g.height=h;
    var x=g.getContext('2d');x.clearRect(0,0,w,h);
    x.strokeStyle='#f5c400';x.lineWidth=2;x.setLineDash([6,4]);
    for(var i=1;i<c;i++){var px=Math.round(w*i/c);x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke()}
    for(var j=1;j<r;j++){var py=Math.round(h*j/r);x.beginPath();x.moveTo(0,py);x.lineTo(w,py);x.stroke()}
    var n=c*r;
    $('info').textContent='元画像 '+img.naturalWidth+'×'+img.naturalHeight+'px → '+n+'枚'+(n>20?'(Xの上限20枚を超えています)':'');
  }
  $('cols').addEventListener('input',function(){drawGrid();clearOut()});
  $('rows').addEventListener('input',function(){drawGrid();clearOut()});
  $('fmt').addEventListener('change',clearOut);
  window.addEventListener('resize',drawGrid);

  function clearOut(){
    urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];pieces=[];
    $('out').innerHTML='';$('zip').disabled=true;$('share').hidden=true;$('hint').textContent='';
  }

  function toBlob(cv,type,q){return new Promise(function(res){cv.toBlob(res,type,q)})}

  $('split').addEventListener('click',async function(){
    if(!img)return;
    clearOut();
    var c=num($('cols')),r=num($('rows')),W=img.naturalWidth,H=img.naturalHeight;
    var isJpg=ext()==='jpg',mime=isJpg?'image/jpeg':'image/png';
    var btn=$('split');btn.disabled=true;btn.textContent='処理中…';
    var out=$('out');
    var pad=String(c*r).length<2?2:String(c*r).length;
    try{
      for(var j=0;j<r;j++)for(var i=0;i<c;i++){
        var x0=Math.floor(W*i/c),x1=Math.floor(W*(i+1)/c),y0=Math.floor(H*j/r),y1=Math.floor(H*(j+1)/r);
        var cv=document.createElement('canvas');cv.width=x1-x0;cv.height=y1-y0;
        var cx=cv.getContext('2d');
        if(isJpg){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height)}
        cx.drawImage(img,x0,y0,cv.width,cv.height,0,0,cv.width,cv.height);
        var b=await toBlob(cv,mime,.95);
        var idx=j*c+i+1,name=img.baseName+'_'+String(idx).padStart(pad,'0')+'.'+ext();
        pieces.push({name:name,blob:b});
        var u=URL.createObjectURL(b);urls.push(u);
        var t=document.createElement('div');t.className='t';
        var im=document.createElement('img');im.src=u;im.alt=name;
        var lb=document.createElement('div');lb.textContent=String(idx);
        t.appendChild(im);t.appendChild(lb);
        {
          var sb=document.createElement('button');sb.className='sub';sb.textContent='保存';
          sb.addEventListener('click',(function(p){return function(){save(p.name,p.blob)}})(pieces[pieces.length-1]));
          t.appendChild(sb);
        }
        if(window.ClipboardItem&&navigator.clipboard){
          var cb=document.createElement('button');cb.className='sub';cb.textContent='コピー';
          cb.addEventListener('click',(function(p,b){return function(){copyImg(p,b)}})(pieces[pieces.length-1],cb));
          t.appendChild(cb);
        }
        out.appendChild(t);
      }
      $('zip').disabled=false;$('share').hidden=!shareFiles().ok;
      $('hint').textContent=pieces.length+'枚に分割しました。'+(true?'ZIPか各画像の「保存」から保存できます。':'各画像を長押しして保存してください。');
    }catch(e){
      $('hint').textContent='分割に失敗しました。画像サイズが大きすぎる可能性があります。';
    }
    btn.disabled=false;btn.textContent='分割する';
  });

  function shareFiles(){
    try{
      var now=Date.now(),f=pieces.map(function(p,i){return new File([p.blob],p.name,{type:p.blob.type,lastModified:now-i*60000})});
      return {files:f,ok:!!(navigator.canShare&&navigator.canShare({files:f}))};
    }catch(e){return {files:[],ok:false}}
  }
  $('share').addEventListener('click',async function(){
    var s=shareFiles();if(!s.ok)return;
    try{await navigator.share({files:s.files})}
    catch(e){if(e&&e.name!=='AbortError')$('hint').textContent='共有できませんでした。画像を長押しして保存してください。'}
  });

  function anchorSave(name,data){
    var u=URL.createObjectURL(data),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }
  async function copyImg(p,btn){
    try{
      var bm=await createImageBitmap(p.blob),cv=document.createElement('canvas');
      cv.width=bm.width;cv.height=bm.height;cv.getContext('2d').drawImage(bm,0,0);
      var pb=await toBlob(cv,'image/png');
      await navigator.clipboard.write([new ClipboardItem({'image/png':pb})]);
      btn.textContent='コピー済';
    }catch(e){btn.textContent='失敗'}
    setTimeout(function(){btn.textContent='コピー'},1500);
  }

  async function save(name,data){
    try{if(dl){await dl.save({filename:name,data:data})}else{anchorSave(name,data)}}
    catch(e){if(e&&e.code!=='declined')$('hint').textContent='保存できませんでした('+e.code+')。画像を右クリック(スマホは長押し)で保存してください。'}
  }

  $('zip').addEventListener('click',async function(){
    if(!pieces.length)return;
    if(!window.JSZip){$('hint').textContent='ZIP用のライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。';return}
    var z=new JSZip();
    var now=Date.now();pieces.forEach(function(p,i){z.file(p.name,p.blob,{date:new Date(now-i*4000)})});
    var blob=await z.generateAsync({type:'blob'});
    save(img.baseName+'_split.zip',blob);
  });
})();
</script>
</body>
</html>
